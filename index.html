
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREN AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10101c;
  color: white;
}

header {
  padding: 22px;
  border-bottom: 1px solid #292940;
  font-size: 25px;
  font-weight: bold;
  color: #a78bfa;
}

main {
  max-width: 750px;
  margin: 70px auto;
  padding: 20px;
  text-align: center;
}

h1 {
  font-size: 38px;
}

h1 span {
  color: #a78bfa;
}

.subtitle {
  color: #aaa;
  margin-bottom: 35px;
}

#chat {
  text-align: left;
  min-height: 180px;
  margin-bottom: 20px;
}

.message {
  background: #202036;
  padding: 15px;
  border-radius: 12px;
  margin: 12px 0;
  line-height: 1.5;
}

.input-area {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #202036;
  color: white;
  font-size: 15px;
}

button {
  padding: 14px 20px;
  border: none;
  border-radius: 12px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

footer {
  margin-top: 50px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<header>✦ AUREN AI</header>

<main>
  <h1>Welcome to <span>AUREN AI</span></h1>

  <p class="subtitle">
    Your ideas. Your questions. One intelligent assistant.
  </p>

  <div id="chat">
    <div class="message">
      Hello! I am AUREN AI. What would you like to know today?
    </div>
  </div>

  <div class="input-area">
    <input id="question"
      placeholder="Ask AUREN anything..."
      onkeydown="if(event.key==='Enter') sendMessage()">

    <button onclick="sendMessage()">Send</button>
  </div>

  <footer>
    AUREN AI © 2026 | Your intelligent assistant
  </footer>
</main>

<script>
function sendMessage() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const question = input.value.trim();

  if (!question) return;

  chat.innerHTML +=
    '<div class="message"><b>You:</b> ' +
    escapeHTML(question) + '</div>';

  chat.innerHTML +=
    '<div class="message"><b>AUREN AI:</b> ' +
    'Thank you for your question! Your AI assistant is being developed. ' +
    'Connect an AI service to enable intelligent answers.</div>';

  input.value = "";
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}
</script>

</body>
</html>
